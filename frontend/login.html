<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Fynexo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2322C55E'/><stop offset='1' stop-color='%2314B8A6'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='%230F172A'/><rect x='4' y='4' width='92' height='92' rx='18' fill='none' stroke='rgba(255,255,255,0.06)' stroke-width='1.5'/><path d='M10 90 C10 50, 42 20, 80 14' stroke='url(%23g)' stroke-width='2' fill='none' opacity='0.45' stroke-linecap='round'/><path d='M28 80 L28 30 L22 30 L34 14 L46 30 L40 30 L40 80 Z' fill='url(%23g)'/><rect x='40' y='32' width='26' height='10' rx='3' fill='url(%23g)'/><rect x='28' y='52' width='22' height='10' rx='3' fill='url(%23g)'/><rect x='62' y='72' width='6' height='12' rx='2' fill='url(%23g)' opacity='0.85'/><rect x='72' y='66' width='6' height='18' rx='2' fill='url(%23g)' opacity='0.85'/><rect x='82' y='58' width='6' height='26' rx='2' fill='url(%23g)' opacity='0.85'/><path d='M78 14 L80 18 L84 20 L80 22 L78 26 L76 22 L72 20 L76 18 Z' fill='white' opacity='0.8'/><circle cx='62' cy='38' r='1.5' fill='white' opacity='0.5'/></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .auth-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(-45deg, #2ecc71, #10b981, #1e293b, #0f172a);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
    }

    .auth-bg-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(2px);
    }

    .auth-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 20px;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius);
      padding: 40px 36px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      will-change: transform;
    }

    [data-theme="dark"] .auth-card {
      background: rgba(30, 41, 59, 0.9);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .auth-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .auth-logo-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      object-fit: cover;
    }

    .auth-logo-text {
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
    }

    .auth-logo-text span { color: var(--primary); }

    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-header h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .auth-header p {
      font-size: 14px;
      color: var(--text-light);
    }

    .auth-form .form-group {
      margin-bottom: 18px;
    }

    .auth-form .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-light);
      display: block;
      margin-bottom: 6px;
    }

    .auth-form .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-xs);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color var(--transition);
    }

    .auth-form .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .auth-form .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .auth-form .checkbox-group input[type="checkbox"] {
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
    }

    .auth-form .checkbox-group label {
      font-size: 13px;
      color: var(--text-light);
      cursor: pointer;
    }

    .auth-form .btn {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      border-radius: var(--radius-xs);
    }

    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-light);
    }

    .auth-footer a {
      color: var(--primary);
      font-weight: 600;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    .auth-error {
      display: none;
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      padding: 10px 14px;
      border-radius: var(--radius-xs);
      font-size: 13px;
      margin-bottom: 16px;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .auth-error.show { display: block; }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-bg"></div>
    <div class="auth-bg-overlay"></div>
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-logo">
          <img src="logo.png" alt="Fynexo" class="auth-logo-icon">
          <div class="auth-logo-text">Fynexo</div>
        </div>
        <div class="auth-header">
          <h1>Welcome Back</h1>
          <p>Sign in to your account</p>
        </div>
        <div class="auth-error" id="loginError"></div>
        <form class="auth-form" id="loginForm">
          <div class="form-group">
            <label class="form-label" for="loginCurrency">Default Currency</label>
            <select class="form-input" id="loginCurrency">
              <option value="USD">$ — US Dollar</option>
              <option value="EUR">€ — Euro</option>
              <option value="GBP">£ — British Pound</option>
              <option value="INR">₹ — Indian Rupee</option>
              <option value="JPY">¥ — Japanese Yen</option>
              <option value="CAD">CA$ — Canadian Dollar</option>
              <option value="AUD">AU$ — Australian Dollar</option>
              <option value="BRL">R$ — Brazilian Real</option>
              <option value="CHF">CHF — Swiss Franc</option>
              <option value="CNY">¥ — Chinese Yuan</option>
              <option value="KRW">₩ — South Korean Won</option>
              <option value="MXN">MX$ — Mexican Peso</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="loginEmail">Email</label>
            <input class="form-input" id="loginEmail" type="email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="loginPassword">Password</label>
            <div class="password-input-wrapper">
              <input class="form-input" id="loginPassword" type="password" placeholder="Enter your password" required>
              <button type="button" class="password-toggle" onclick="togglePassword('loginPassword')">
                <i data-lucide="eye" style="width:18px;height:18px"></i>
              </button>
            </div>
          </div>
          <div style="text-align:right;margin:-4px 0 14px">
            <a href="#" onclick="openForgotPasswordModal();return false"
               style="font-size:13px;color:var(--primary);font-weight:600;text-decoration:none;transition:opacity 0.2s"
               onmouseover="this.style.opacity='0.7'" onmouseout="this.style.opacity='1'">Forgot Password?</a>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="rememberMe">
            <label for="rememberMe">Remember me</label>
          </div>
          <button type="submit" class="btn btn-primary">Sign In</button>
          <div style="display:flex;align-items:center;gap:12px;margin:16px 0">
            <div style="flex:1;height:1px;background:var(--border)"></div>
            <span style="font-size:12px;color:var(--text-lighter)">or</span>
            <div style="flex:1;height:1px;background:var(--border)"></div>
          </div>
          <button type="button" class="btn btn-outline" id="guestLoginBtn" style="width:100%">
            <i data-lucide="user-plus" style="width:16px;height:16px"></i>
            Continue as Guest
          </button>
        </form>
        <div class="auth-footer">
          Don't have an account? <a href="signup.html">Create one</a>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-overlay" id="forgotPasswordModal">
    <div class="modal" style="max-width:440px">
      <div class="modal-header">
        <h3 class="modal-title">Reset Your Password</h3>
        <button class="modal-close" onclick="closeForgotPasswordModal()">
          <i data-lucide="x" style="width:18px;height:18px"></i>
        </button>
      </div>
      <div class="modal-body">
        <p style="font-size:14px;color:var(--text-light);margin-bottom:20px">
          Enter your registered email to receive a reset link.
        </p>
        <div class="auth-error" id="forgotError"></div>
        <div class="form-group">
          <label class="form-label" for="forgotEmail">Email Address</label>
          <input class="form-input" id="forgotEmail" type="email" placeholder="you@example.com" required>
        </div>
        <button class="btn btn-primary" id="sendResetLinkBtn" onclick="handleForgotPassword()" style="width:100%;margin-top:4px">
          Send Reset Link
        </button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    lucide.createIcons();

    function togglePassword(id) {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function openForgotPasswordModal() {
      document.getElementById('forgotPasswordModal').classList.add('active');
      document.getElementById('forgotEmail').value = '';
      document.getElementById('forgotError').classList.remove('show');
      lucide.createIcons();
    }

    function closeForgotPasswordModal() {
      document.getElementById('forgotPasswordModal').classList.remove('active');
    }

    async function handleForgotPassword() {
      const email = document.getElementById('forgotEmail').value.trim();
      const errorEl = document.getElementById('forgotError');
      const btn = document.getElementById('sendResetLinkBtn');
      if (!email) {
        errorEl.textContent = 'Please enter your email address.';
        errorEl.classList.add('show');
        return;
      }
      errorEl.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Sending...';
      const r = await apiRequest('POST', '/api/auth/forgot-password', { email });
      if (r.ok) {
        Toast.success("You'll receive a password reset link shortly.");
        closeForgotPasswordModal();
      } else {
        errorEl.textContent = r.data.error || 'Something went wrong. Please try again.';
        errorEl.classList.add('show');
      }
      btn.disabled = false;
      btn.textContent = 'Send Reset Link';
    }

    document.addEventListener('click', function(e) {
      const modal = document.getElementById('forgotPasswordModal');
      if (e.target === modal) closeForgotPasswordModal();
    });
  </script>
</body>
</html>
