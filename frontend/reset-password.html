<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Fynexo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2322C55E'/><stop offset='1' stop-color='%2314B8A6'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='%230F172A'/><rect x='4' y='4' width='92' height='92' rx='18' fill='none' stroke='rgba(255,255,255,0.06)' stroke-width='1.5'/><path d='M10 90 C10 50, 42 20, 80 14' stroke='url(%23g)' stroke-width='2' fill='none' opacity='0.45' stroke-linecap='round'/><path d='M28 80 L28 30 L22 30 L34 14 L46 30 L40 30 L40 80 Z' fill='url(%23g)'/><rect x='40' y='32' width='26' height='10' rx='3' fill='url(%23g)'/><rect x='28' y='52' width='22' height='10' rx='3' fill='url(%23g)'/><rect x='62' y='72' width='6' height='12' rx='2' fill='url(%23g)' opacity='0.85'/><rect x='72' y='66' width='6' height='18' rx='2' fill='url(%23g)' opacity='0.85'/><rect x='82' y='58' width='6' height='26' rx='2' fill='url(%23g)' opacity='0.85'/><path d='M78 14 L80 18 L84 20 L80 22 L78 26 L76 22 L72 20 L76 18 Z' fill='white' opacity='0.8'/><circle cx='62' cy='38' r='1.5' fill='white' opacity='0.5'/></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .auth-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(-45deg, #2ecc71, #10b981, #1e293b, #0f172a);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
    }

    .auth-bg-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(2px);
    }

    .auth-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 20px;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius);
      padding: 40px 36px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      will-change: transform;
    }

    [data-theme="dark"] .auth-card {
      background: rgba(30, 41, 59, 0.9);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .auth-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .auth-logo-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      object-fit: cover;
    }

    .auth-logo-text {
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
    }

    .auth-logo-text span { color: var(--primary); }

    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-header h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .auth-header p {
      font-size: 14px;
      color: var(--text-light);
    }

    .auth-form .form-group {
      margin-bottom: 18px;
    }

    .auth-form .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-light);
      display: block;
      margin-bottom: 6px;
    }

    .auth-form .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-xs);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color var(--transition);
    }

    .auth-form .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .auth-form .btn {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      border-radius: var(--radius-xs);
    }

    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-light);
    }

    .auth-footer a {
      color: var(--primary);
      font-weight: 600;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    .auth-error {
      display: none;
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      padding: 10px 14px;
      border-radius: var(--radius-xs);
      font-size: 13px;
      margin-bottom: 16px;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .auth-error.show { display: block; }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-bg"></div>
    <div class="auth-bg-overlay"></div>
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-logo">
          <img src="logo.png" alt="Fynexo" class="auth-logo-icon">
          <div class="auth-logo-text">Fynexo</div>
        </div>
        <div class="auth-header">
          <h1>Reset Your Password</h1>
          <p>Enter your registered email to receive a reset link.</p>
        </div>
        <div class="auth-error" id="resetError"></div>
        <form class="auth-form" id="resetForm">
          <div class="form-group">
            <label class="form-label" for="resetPassword">New Password</label>
            <div class="password-input-wrapper">
              <input class="form-input" id="resetPassword" type="password" placeholder="At least 6 characters" required minlength="6">
              <button type="button" class="password-toggle" onclick="togglePassword('resetPassword')">
                <i data-lucide="eye" style="width:18px;height:18px"></i>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="resetConfirmPassword">Confirm Password</label>
            <div class="password-input-wrapper">
              <input class="form-input" id="resetConfirmPassword" type="password" placeholder="Confirm your password" required>
              <button type="button" class="password-toggle" onclick="togglePassword('resetConfirmPassword')">
                <i data-lucide="eye" style="width:18px;height:18px"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Reset Password</button>
        </form>
        <div class="auth-footer">
          <a href="login.html">Back to Sign In</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    lucide.createIcons();

    const token = new URLSearchParams(window.location.search).get('token');

    if (!token) {
      document.getElementById('resetError').textContent = 'Invalid or missing reset token. Please request a new reset link.';
      document.getElementById('resetError').classList.add('show');
      document.getElementById('resetForm').querySelector('button[type="submit"]').disabled = true;
    }

    function togglePassword(id) {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    document.getElementById('resetForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const password = document.getElementById('resetPassword').value;
      const confirm = document.getElementById('resetConfirmPassword').value;
      const errorEl = document.getElementById('resetError');
      const btn = this.querySelector('button[type="submit"]');

      errorEl.classList.remove('show');

      if (password.length < 6) {
        errorEl.textContent = 'Password must be at least 6 characters.';
        errorEl.classList.add('show');
        return;
      }

      if (password !== confirm) {
        errorEl.textContent = 'Passwords do not match.';
        errorEl.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Resetting...';

      const r = await apiRequest('POST', '/api/auth/reset-password/' + token, { password });

      if (r.ok) {
        Toast.success('Password reset successful! Redirecting to login...');
        setTimeout(function() {
          window.location.href = 'login.html';
        }, 2000);
      } else {
        errorEl.textContent = r.data.error || 'Something went wrong. Please try again.';
        errorEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
